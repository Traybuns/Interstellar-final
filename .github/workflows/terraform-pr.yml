# ── .github/workflows/terraform-pr.yml ───────────────────────
# Triggered on pull requests that touch Terraform files.
# Runs terraform plan for prod and posts the plan output as a PR comment.
# Does NOT apply.
#
# Required GitHub secrets (repo level):
#   PROD_TF_ROLE_ARN         IAM Terraform role ARN for prod
#   PROD_TF_STATE_BUCKET     S3 state bucket name for prod
#   PROD_TF_STATE_KEY        State file key for prod (e.g. prod/terraform.tfstate)
#   PROD_TF_LOCK_TABLE       DynamoDB lock table name for prod
#
# Note: dev and staging plan jobs removed — add their secrets and
# uncomment those jobs when you are ready to bring those environments in.

name: Terraform Plan (PR)

on:
  pull_request:
    paths:
      - "interstellar-co/**/*.tf"
      - "interstellar-co/**/*.tfvars"
      - ".github/workflows/terraform-pr.yml"
      - ".github/workflows/_terraform.yml"

permissions:
  id-token: write   # Required for OIDC — passed through to the reusable workflow
  contents: read
  pull-requests: write  # Allows the plan job to post PR comments

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan-prod:
    name: Plan prod
    uses: ./.github/workflows/_terraform.yml
    with:
      environment: prod
      working_directory: interstellar-co/environments/prod
      aws_region: eu-north-1
      apply: false
    secrets:
      TF_ROLE_ARN: ${{ secrets.PROD_TF_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ secrets.PROD_TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ secrets.PROD_TF_STATE_KEY }}
      TF_LOCK_TABLE: ${{ secrets.PROD_TF_LOCK_TABLE }}
