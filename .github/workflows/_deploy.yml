# ── .github/workflows/_deploy.yml ────────────────────────────
# Reusable workflow: sync website files to S3 and invalidate CloudFront.
#
# Called by deploy.yml after terraform apply succeeds.
# Not triggered directly.

name: Deploy website (reusable)

on:
  workflow_call:
    inputs:
      aws_region:
        description: "AWS region for the deployment"
        required: true
        type: string
      website_bucket_name:
        description: "S3 bucket name to sync files into"
        required: true
        type: string
      cloudfront_distribution_id:
        description: "CloudFront distribution ID for cache invalidation"
        required: true
        type: string
      source_dir:
        description: "Local path to the directory containing website files"
        required: false
        type: string
        default: "interstellar-co/website"
    secrets:
      DEPLOY_ROLE_ARN:
        description: "IAM role ARN to assume for S3 + CloudFront operations (OIDC)"
        required: true

jobs:
  deploy:
    name: Deploy website
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: github-actions-deploy

      # Two-pass sync:
      #   Pass 1 — assets (CSS, JS, fonts, images): long-lived immutable cache.
      #   Pass 2 — HTML + JSON: no-cache so users always get the latest content.
      - name: Sync website assets to S3
        run: |
          aws s3 sync "${{ inputs.source_dir }}/" "s3://${{ inputs.website_bucket_name }}/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.json"

      - name: Sync HTML and JSON to S3
        run: |
          aws s3 sync "${{ inputs.source_dir }}/" "s3://${{ inputs.website_bucket_name }}/" \
            --delete \
            --cache-control "no-cache, no-store, must-revalidate" \
            --include "*.html" \
            --include "*.json"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ inputs.cloudfront_distribution_id }}" \
            --paths "/*"
