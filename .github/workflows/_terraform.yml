# ── .github/workflows/_terraform.yml ─────────────────────────
# Reusable workflow: terraform init, plan, and (optionally) apply
# for a given environment directory.
#
# Called by the per-environment workflows. Not triggered directly.

name: Terraform (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev | staging | prod)"
        required: true
        type: string
      working_directory:
        description: "Path to the environment Terraform root"
        required: true
        type: string
      aws_region:
        description: "AWS region for the environment"
        required: true
        type: string
      apply:
        description: "Run terraform apply after plan (true/false)"
        required: false
        type: boolean
        default: false
    secrets:
      TF_ROLE_ARN:
        description: "ARN of the IAM role to assume for terraform operations"
        required: true
      TF_STATE_BUCKET:
        description: "S3 bucket name for Terraform state"
        required: true
      TF_STATE_KEY:
        description: "S3 key (path) for the Terraform state file"
        required: true
      TF_LOCK_TABLE:
        description: "DynamoDB table name for Terraform state locking"
        required: true
    outputs:
      cloudfront_distribution_id:
        description: "CloudFront distribution ID (from terraform output)"
        value: ${{ jobs.terraform.outputs.cloudfront_distribution_id }}
      website_bucket_name:
        description: "Website S3 bucket name (from terraform output)"
        value: ${{ jobs.terraform.outputs.website_bucket_name }}

permissions:
  id-token: write   # Required for OIDC
  contents: read

jobs:
  terraform:
    name: Terraform ${{ inputs.apply && 'Apply' || 'Plan' }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    outputs:
      cloudfront_distribution_id: ${{ steps.outputs.outputs.cloudfront_distribution_id }}
      website_bucket_name: ${{ steps.outputs.outputs.website_bucket_name }}

    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TF_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: github-actions-terraform-${{ inputs.environment }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false   # Disable wrapper so outputs can be parsed cleanly

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.TF_STATE_KEY }}" \
            -backend-config="region=${{ inputs.aws_region }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="aws_region=${{ inputs.aws_region }}" \
            -var="tf_state_bucket_name=${{ secrets.TF_STATE_BUCKET }}" \
            -out=tfplan \
            -no-color 2>&1 | tee plan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}-${{ github.run_id }}
          path: |
            ${{ inputs.working_directory }}/tfplan
            ${{ inputs.working_directory }}/plan.txt
          retention-days: 5

      - name: Terraform Apply
        if: inputs.apply == true
        run: terraform apply -auto-approve tfplan

      - name: Capture Terraform outputs
        id: outputs
        if: inputs.apply == true
        run: |
          echo "cloudfront_distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "website_bucket_name=$(terraform output -raw website_bucket_name)" >> "$GITHUB_OUTPUT"
