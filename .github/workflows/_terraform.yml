# ── .github/workflows/_terraform.yml ─────────────────────────
# Reusable workflow: terraform init → validate → plan → (optional) apply.
#
# Callers pass secrets directly — no environment-level secret inheritance
# needed. The caller workflow must declare:
#   permissions:
#     id-token: write   # OIDC credential exchange with AWS
#     contents: read

name: Terraform (reusable)

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Path to the Terraform root module"
        required: true
        type: string
      aws_region:
        description: "AWS region for the deployment"
        required: true
        type: string
      apply:
        description: "Run terraform apply after a successful plan"
        required: false
        type: boolean
        default: false
    secrets:
      TF_ROLE_ARN:
        description: "IAM role ARN to assume for Terraform operations (OIDC)"
        required: true
      TF_STATE_BUCKET:
        description: "S3 bucket name for Terraform remote state"
        required: true
      TF_LOCK_TABLE:
        description: "DynamoDB table name for Terraform state locking"
        required: true
    outputs:
      cloudfront_distribution_id:
        description: "CloudFront distribution ID (populated after apply)"
        value: ${{ jobs.terraform.outputs.cloudfront_distribution_id }}
      website_bucket_name:
        description: "Website S3 bucket name (populated after apply)"
        value: ${{ jobs.terraform.outputs.website_bucket_name }}

# Permissions are set on the CALLER workflow, not here.
# Reusable workflows inherit the caller's permissions.

jobs:
  terraform:
    name: Terraform ${{ inputs.apply && 'Apply' || 'Plan' }}
    runs-on: ubuntu-latest

    # Scoped to the GitHub environment named "dev" — allows environment
    # protection rules and environment-level secret overrides if needed.
    environment: dev

    outputs:
      cloudfront_distribution_id: ${{ steps.tf-outputs.outputs.cloudfront_distribution_id }}
      website_bucket_name: ${{ steps.tf-outputs.outputs.website_bucket_name }}

    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TF_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: github-actions-terraform

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          # Disable the wrapper — it wraps stdout which breaks `terraform output -raw`
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=${{ inputs.aws_region }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="aws_region=${{ inputs.aws_region }}" \
            -var="tf_state_bucket_name=${{ secrets.TF_STATE_BUCKET }}" \
            -out=tfplan \
            -no-color 2>&1 | tee plan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: |
            ${{ inputs.working_directory }}/tfplan
            ${{ inputs.working_directory }}/plan.txt
          retention-days: 5

      - name: Terraform Apply
        if: inputs.apply == true
        run: terraform apply -auto-approve tfplan

      - name: Capture Terraform outputs
        id: tf-outputs
        if: inputs.apply == true
        run: |
          echo "cloudfront_distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "website_bucket_name=$(terraform output -raw website_bucket_name)" >> "$GITHUB_OUTPUT"
